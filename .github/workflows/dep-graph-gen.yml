name: Generate Dependency Graph

on:
  workflow_dispatch:

jobs:
  build-graph:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: Install Project Dependencies
        run: npm install

      - name: Install Graphviz and Madge
        run: |
          sudo apt-get update
          sudo apt-get install -y graphviz
          npm install -g madge
          dot -V

      - name: Install dependencies & build packages
        run: |
          npm ci
          npm run build

      - name: Patch vm2 for Standalone Bundling
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          function findVm2Dirs(startDir) {
            const results = [];
            function walk(current) {
              if (!fs.existsSync(current)) return;
              try {
                const files = fs.readdirSync(current, { withFileTypes: true });
                for (const f of files) {
                  const full = path.join(current, f.name);
                  if (f.isDirectory()) {
                    if (f.name === "vm2") results.push(full);
                    else if (f.name !== ".git") walk(full);
                  }
                }
              } catch (e) {}
            }
            walk(startDir);
            return results;
          }

          const vm2Dirs = findVm2Dirs(path.resolve("node_modules"));
          console.log("Found vm2 directories:", vm2Dirs);

          for (const vm2Dir of vm2Dirs) {
            const libDir = path.join(vm2Dir, "lib");
            if (!fs.existsSync(libDir)) continue;

            const libFiles = fs.readdirSync(libDir);
            for (const file of libFiles) {
              if (!file.endsWith(".js")) continue;
              const filePath = path.join(libDir, file);
              let code = fs.readFileSync(filePath, "utf8");
              let modified = false;

              for (const target of ["bridge.js", "setup-sandbox.js", "setup-node-sandbox.js"]) {
                const targetPath = path.join(libDir, target);
                if (fs.existsSync(targetPath)) {
                  const content = fs.readFileSync(targetPath, "utf8");
                  const regex = new RegExp(`fs\\.readFileSync\\([^)]*${target.replace(".", "\\.")}[^)]*\\)`, "g");
                  if (regex.test(code)) {
                    code = code.replace(regex, `JSON.parse(${JSON.stringify(JSON.stringify(content))})`);
                    modified = true;
                  }
                }
              }

              if (modified) {
                fs.writeFileSync(filePath, code, "utf8");
                console.log(`Inlined dependencies in ${filePath}`);
              }
            }
          }
          '

      - name: Generate Timestamp and Graphs
        id: graph-gen
        run: |
          # Create timestamp variable in YYYYMMDD-HHMMSS format
          TIMESTAMP=$(date +'%Y%m%d-%H%M%S')
          echo "TIMESTAMP=$TIMESTAMP" >> $GITHUB_ENV
          
          mkdir -p output
          
          # Generate files with the timestamp included in the filename
          # Replace 'src/index.js' with your project's main entry point file
          madge src/ --extensions js,jsx,mjs,ts,tsx --dot > "output/dependencies-$TIMESTAMP.dot"
          madge src/ --extensions js,jsx,mjs,ts,tsx --image "output/dependencies-$TIMESTAMP.svg"
          dot -Tps -Gpage="8.5,11" "output/dependencies-$TIMESTAMP.dot" -o "output/dependencies-$TIMESTAMP.pdf"
#          madge  ./dist/index.js --dot > 
          

      - name: Upload Dependency Artifacts
        uses: actions/upload-artifact@v4
        with:
          # Unique artifact container name per run
          name: node-dependency-graph-${{ env.TIMESTAMP }}
          path: |
            output/*.dot
            output/*.svg
            output/*.pdf
          retention-days: 7
