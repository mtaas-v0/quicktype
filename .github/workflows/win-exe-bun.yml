name: Compile Windows Executables

on:
  push:
    branches: [ master, main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-windows-binaries:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        include:
          - target: bun-windows-x64
            arch: x64
          - target: bun-windows-arm64
            arch: arm64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Generate Build Metadata
        id: meta
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"

      - name: Install dependencies & build packages
        run: |
          npm ci
          npm run build

      - name: Patch vm2 for Standalone Bundling
        run: |
          node -e '
          const fs = require("fs");
          const path = require("path");

          function findVm2Dirs(startDir) {
            const results = [];
            function walk(current) {
              if (!fs.existsSync(current)) return;
              try {
                const files = fs.readdirSync(current, { withFileTypes: true });
                for (const f of files) {
                  const full = path.join(current, f.name);
                  if (f.isDirectory()) {
                    if (f.name === "vm2") results.push(full);
                    else if (f.name !== ".git") walk(full);
                  }
                }
              } catch (e) {}
            }
            walk(startDir);
            return results;
          }

          const vm2Dirs = findVm2Dirs(path.resolve("node_modules"));
          console.log("Found vm2 directories:", vm2Dirs);

          for (const vm2Dir of vm2Dirs) {
            const libDir = path.join(vm2Dir, "lib");
            if (!fs.existsSync(libDir)) continue;

            const libFiles = fs.readdirSync(libDir);
            for (const file of libFiles) {
              if (!file.endsWith(".js")) continue;
              const filePath = path.join(libDir, file);
              let code = fs.readFileSync(filePath, "utf8");
              let modified = false;

              for (const target of ["bridge.js", "setup-sandbox.js", "setup-node-sandbox.js"]) {
                const targetPath = path.join(libDir, target);
                if (fs.existsSync(targetPath)) {
                  const content = fs.readFileSync(targetPath, "utf8");
                  const regex = new RegExp(`fs\\.readFileSync\\([^)]*${target.replace(".", "\\.")}[^)]*\\)`, "g");
                  if (regex.test(code)) {
                    code = code.replace(regex, `JSON.parse(${JSON.stringify(JSON.stringify(content))})`);
                    modified = true;
                  }
                }
              }

              if (modified) {
                fs.writeFileSync(filePath, code, "utf8");
                console.log(`Inlined dependencies in ${filePath}`);
              }
            }
          }
          '

      - name: Bun Compile for Windows (${{ matrix.arch }})
        run: |
          mkdir -p bin
          OUTPUT_NAME="quicktype-windows-${{ matrix.arch }}-run${{ github.run_number }}-${{ steps.meta.outputs.short_sha }}-${{ steps.meta.outputs.date }}.exe"
          bun build --compile --minify \
            --target=${{ matrix.target }} \
            ./dist/index.js \
            --outfile "./bin/$OUTPUT_NAME"

      - name: Upload Windows Executable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quicktype-windows-${{ matrix.arch }}-run${{ github.run_number }}-${{ steps.meta.outputs.short_sha }}-${{ steps.meta.outputs.date }}
          path: ./bin/*.exe

  release:
    needs: build-windows-binaries
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/**/*.exe
